<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SIGUNARA · Seguimiento de trámites</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B4332">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="apple-mobile-web-app-title" content="SIGUNARA">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Marca SIGUNARA: verde institucional + amarillo-lima + blanco, en bloques sólidos. Tema único (claro) a propósito. */
:root{
  --verde:#1B4332; --verde-2:#14432A; --lima:#D4E157; --lima-2:#C6D62E; --blanco:#FFFFFF;
  --bg:#F4F6F2; --surface:#FFFFFF; --surface-2:#E7ECE5; --ink:#12291F; --ink-2:#4A5C52; --line:#D2DBD3;
  --accent:#1B4332; --accent-ink:#FFFFFF; --accent-soft:#E4EBC0;
  --alta:#B3261E; --alta-soft:#F6E0DD; --media:#1B4332; --media-soft:#D4E157; --baja:#4A5C52; --baja-soft:#E7ECE5;
  --ok:#1B4332; --ok-soft:#D4E157; --warn:#8A5A00; --warn-soft:#F4EFC9;
  --shadow:0 1px 2px rgba(18,41,31,.07);
  --display:"Archivo","Arial",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px}

.demo{background:var(--lima);color:var(--verde);font-size:12.5px;padding-block:7px}
.demo .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo b{font-weight:800;text-transform:uppercase;letter-spacing:.04em}

header.top{background:var(--verde);color:var(--blanco);border-bottom:5px solid var(--lima);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .wrap{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:10px 0}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand img{width:52px;height:52px;border-radius:50%;background:var(--blanco);flex:none}
.brand strong{display:block;font-weight:800;font-size:22px;letter-spacing:.06em;line-height:1}
.brand span{display:block;color:var(--lima);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.whoami{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--lima)}
.whoami select{padding:5px 8px;border:0;border-radius:4px;background:var(--blanco);color:var(--verde);font-weight:700;text-transform:none;letter-spacing:0}
nav.tabs{display:flex;gap:4px;overflow-x:auto;width:100%;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:9px 14px;border-radius:4px 4px 0 0;cursor:pointer;color:var(--blanco);opacity:.8;font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-current="true"]{background:var(--lima);color:var(--verde);opacity:1}
nav.tabs button:hover{opacity:1}
nav.tabs .count{background:var(--blanco);color:var(--verde)}
.count{font-size:11px;font-weight:700;background:var(--surface-2);color:var(--ink-2);border-radius:10px;padding:1px 7px;font-variant-numeric:tabular-nums;letter-spacing:0}
.count.hot,nav.tabs .count.hot{background:var(--alta);color:var(--blanco)}

main{padding-block:20px 60px}
h1{font-size:22px;font-weight:800;margin:0;text-wrap:balance;text-transform:uppercase;letter-spacing:.03em;color:var(--verde)}
h2{font-size:14px;font-weight:800;margin:0;text-wrap:balance;text-transform:uppercase;letter-spacing:.05em;color:var(--verde)}
.lede{color:var(--ink-2);margin:4px 0 0;max-width:70ch}
.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}

.alerts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:16px}
.alert{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer}
.alert:hover{border-color:var(--ink-2)}
.alert .n{font-size:24px;font-weight:800;font-stretch:80%;font-variant-numeric:tabular-nums;min-width:2ch}
.alert small{color:var(--ink-2);display:block;line-height:1.3}
.alert.crit .n{color:var(--alta)} .alert.warn .n{color:var(--warn)} .alert.info .n{color:var(--accent)}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input,.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;min-width:0}
.filters input{flex:1 1 220px}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:980px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.board{grid-template-columns:1fr}}
.col{background:var(--surface-2);border-radius:6px;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.col>header{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;margin:0 -10px 2px;background:var(--verde);border-bottom:4px solid var(--lima)}
.col>header h2{font-size:12.5px;letter-spacing:.08em;color:var(--blanco)}
.col>header .count{background:var(--lima);color:var(--verde)}
.col .empty{font-size:12.5px;color:var(--ink-2);padding:6px 4px}

.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--baja);border-radius:8px;padding:10px 11px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);width:100%}
.card:hover{border-color:var(--ink-2)}
.card.p-Alta{border-left-color:var(--alta)} .card.p-Media{border-left-color:var(--lima-2)} .card.p-Baja{border-left-color:var(--baja)} .card.p-none{border-left-color:var(--line)}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink-2)}
.card .ref{font-weight:600;line-height:1.3}
.gde{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);word-break:break-all}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;white-space:nowrap}
.chip.Alta{background:var(--alta-soft);color:var(--alta)} .chip.Media{background:var(--media-soft);color:var(--media)} .chip.Baja{background:var(--baja-soft);color:var(--baja)}
.chip.inst{background:var(--accent-soft);color:var(--accent)}
.chip.st{background:var(--surface-2);color:var(--ink-2)}
.chip.neg{background:var(--alta-soft);color:var(--alta)} .chip.okc{background:var(--ok-soft);color:var(--ok)}
.chip.stale{background:var(--warn-soft);color:var(--warn)}
.chip.ia{background:var(--accent-soft);color:var(--accent)}

/* panel */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:40}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--bg);z-index:41;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.18);padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(env(safe-area-inset-bottom,0px) + 40px)}
.panel .close{position:sticky;top:0;float:right;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font-weight:600}
.panel h1{font-size:21px;margin-top:6px}
.panel section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:14px}
.panel section>header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px}
.kv div small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin-bottom:2px}
.kv select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 7px;width:100%}
.summary{background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin-top:10px}
.summary p{margin:4px 0 0}

.docs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.docs ul{list-style:none;margin:6px 0 0 18px;padding:0 0 0 12px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.doc{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.doc .t{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.doc .d{font-weight:600;margin:1px 0}
.doc .nofile{font-size:11.5px;color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 14px 20px;border-left:2px solid var(--line);margin-left:5px}
.timeline li:last-child{border-left-color:transparent}
.timeline li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.timeline .when{font-size:12px;color:var(--ink-2)}
.timeline .when b{color:var(--ink);font-weight:600}
.timeline p{margin:3px 0 0;max-width:65ch}

form.inline{display:grid;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 160px}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2)}
.field textarea{min-height:70px;resize:vertical}
.field input[type=file]{padding:5px}

/* pedidos */
.list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.req{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.req.nuevo{border-color:var(--alta)}
.req .who{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.req .who strong{font-size:15px}
.req .contact{font-size:12.5px;color:var(--ink-2);display:flex;gap:4px 14px;flex-wrap:wrap}
.req .contact span{user-select:all}
.checks{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.checks input{width:17px;height:17px;accent-color:var(--accent)}

/* pendientes */
.group{margin-bottom:18px}
.group>h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin-bottom:8px}
.pend{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:6px;flex-wrap:wrap}
.pend .l{display:flex;flex-direction:column;gap:4px;flex:1 1 280px}

/* admin */
.admin{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));align-items:start}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.box>p{color:var(--ink-2);margin:4px 0 10px;font-size:13px}
.plain{list-style:none;margin:0;padding:0}
.plain li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.plain li:last-child{border-bottom:0}
.x{background:none;border:0;color:var(--alta);cursor:pointer;font-weight:700;padding:2px 6px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line)}
.kw{display:flex;gap:6px;flex-wrap:wrap}
.kw span{font-family:var(--mono);font-size:12px;background:var(--surface-2);border-radius:4px;padding:2px 7px}

.steps{display:flex;gap:4px;margin:10px 0 4px;flex-wrap:wrap}
.steps span{flex:1 1 90px;text-align:center;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:7px 4px;background:var(--surface-2);color:var(--ink-2)}
.steps span.done{background:var(--verde);color:var(--blanco)}
.steps span.now{background:var(--lima);color:var(--verde)}
.chip.vis{background:var(--lima);color:var(--verde)} .chip.int{background:var(--surface-2);color:var(--ink-2)}
.timeline li.afil::before{background:var(--lima);border-color:var(--verde)}
.timeline li.afil p{background:var(--accent-soft);padding:6px 9px;border-radius:4px}
.access{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-left:5px solid var(--lima);padding:10px 12px;margin-top:12px}
.access>input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--verde);margin-top:2px}
.access>div{flex:1;min-width:0}
.access .field input{width:100%;max-width:420px}
.multi{display:flex;flex-wrap:wrap;gap:6px}
.pick{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:5px 9px;font-size:12.5px;color:var(--ink);cursor:pointer}
.pick input{width:15px;height:15px;accent-color:var(--verde);margin:0}
.pick:has(input:checked){background:var(--lima);border-color:var(--lima-2);color:var(--verde);font-weight:700}
.resp-list{display:flex;flex-wrap:wrap;gap:4px}
.resp-list span{background:var(--accent-soft);color:var(--verde);font-weight:700;font-size:12px;padding:2px 7px;border-radius:4px}
.hello{background:var(--verde);color:var(--blanco);padding:16px;border-bottom:5px solid var(--lima);margin-bottom:16px}
.hello h1{color:var(--blanco)} .hello p{margin:4px 0 0;color:var(--lima);font-weight:600}
.expbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.expbox .none{color:var(--warn);font-weight:700}
.chip.noexp{background:var(--warn-soft);color:var(--warn)}
.login{min-height:70vh;display:grid;place-items:center;padding-block:24px}
.login .card{max-width:400px;width:100%;cursor:default;border-left:0;border-top:6px solid var(--lima);padding:26px 22px;gap:14px;align-items:center;text-align:center}
.login img{width:92px;height:92px;border-radius:50%}
.login h1{font-size:20px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border:1px solid var(--line);border-radius:4px;background:var(--blanco);font-weight:700;cursor:pointer;color:#1f1f1f}
.gbtn:hover{border-color:var(--verde)}
.gbtn svg{width:18px;height:18px}
.or{display:flex;align-items:center;gap:8px;width:100%;color:var(--ink-2);font-size:12px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.panel{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
.apilado{display:grid;gap:10px;width:100%;text-align:left}
.linkbtn{background:none;border:0;color:var(--verde);font-weight:700;text-decoration:underline;cursor:pointer;padding:2px;font-size:13.5px}
.login .nota{margin:0;color:var(--ink-2)}
.login h2{font-size:15px}
.board{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1200px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.board{grid-template-columns:1fr}}
.orden{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:6px;flex-wrap:wrap}
.orden.p-Alta{border-left-color:var(--alta)} .orden.p-Media{border-left-color:var(--lima-2)} .orden.p-Baja{border-left-color:var(--baja)}
.orden.primero{border-width:2px 2px 2px 6px;border-color:var(--verde)}
.orden .pos{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--verde);color:var(--lima);font-weight:800;font-size:17px}
.orden .l{display:flex;flex-direction:column;gap:4px;flex:1 1 280px;min-width:0}
.orden .l strong{font-size:15px}
.orden .acc{display:flex;gap:6px;flex:0 0 auto;align-items:center}
.orden .acc .btn{min-width:36px}
.aviso-guardar{position:sticky;top:8px;z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--lima);color:var(--verde);font-weight:700;border-radius:8px;padding:10px 12px;margin-bottom:12px}
.chip.espera{background:#E3ECF7;color:#1F4E79;font-weight:700}
.selbox{display:inline-flex;align-items:center;cursor:pointer;padding:2px}
.selbox input{width:18px;height:18px;accent-color:var(--verde);cursor:pointer}
.grupo-cab{display:flex;gap:8px;align-items:center;margin:0 0 8px}
h2.grupo-cab{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--verde);border-bottom:3px solid var(--lima);padding-bottom:6px}
h3.grupo-cab{font-size:13px;color:var(--ink);margin-top:6px}
h4.grupo-cab{font-size:12.5px;color:var(--ink-2);font-weight:700}
.subgrupo{margin:6px 0 10px 14px;padding-left:10px;border-left:3px solid var(--line)}
.req .who{align-items:center;gap:8px}
details.group>summary{cursor:pointer;font-weight:700;color:var(--ink-2)}
</style>

<style>
#who{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--lima)}
#who .btn{background:transparent;color:var(--blanco);border-color:rgba(255,255,255,.45)}
body.ocupado{cursor:progress}
body.ocupado::after{content:"";position:fixed;top:0;left:0;height:4px;width:100%;background:linear-gradient(90deg,var(--lima) 0 40%,transparent 40%);background-size:200% 100%;animation:carga 1s linear infinite;z-index:80}
@keyframes carga{from{background-position:100% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){body.ocupado::after{animation:none;background:var(--lima)}}
</style>
</head>

<script>
/* SIGUNARA · Seguimiento de trámites — pantalla (corre en el navegador, habla con api() del servidor) */
const ESPERA = "Presentado, esperando respuesta oficial";
const ESTADOS_BASE = ["Sin iniciar","En curso",ESPERA,"Judicializado","Finalizado","Respuesta negativa","Cancelado por nosotros"];
const CERRADOS_BASE = ["Finalizado","Respuesta negativa","Cancelado por nosotros"];
const COLS_ESTADO = ["Sin iniciar","En curso","Esperando respuesta","Judicializado","Cerrados"]; // columnas del tablero
const COL_BASE = {"Sin iniciar":"Sin iniciar","En curso":"En curso",[ESPERA]:"Esperando respuesta","Judicializado":"Judicializado"};
let ESTADOS = ESTADOS_BASE.slice(), ACTIVOS = ["En curso",ESPERA,"Judicializado"], CERRADOS = CERRADOS_BASE.slice();
const estadosExtra = ()=>(D&&D.estadosExtra)||[];
const esExtra = s=>estadosExtra().some(e=>e.nombre===s);
function colDe(s){if(!s)return "En curso";const x=estadosExtra().find(e=>e.nombre===s);if(x)return x.col;return COL_BASE[s]||(CERRADOS.includes(s)?"Cerrados":"En curso")}
/* Suma los estados agregados en Administración a las listas (los abiertos antes de "Judicializado", los cerrados al final). */
function aplicarEstados(){
  const ex=estadosExtra(),ab=ex.filter(e=>e.col!=="Cerrados").map(e=>e.nombre),ce=ex.filter(e=>e.col==="Cerrados").map(e=>e.nombre);
  ESTADOS=["Sin iniciar","En curso",ESPERA,...ab,"Judicializado","Finalizado","Respuesta negativa","Cancelado por nosotros",...ce];
  CERRADOS=[...CERRADOS_BASE,...ce];
  ACTIVOS=["En curso",ESPERA,"Judicializado",...ex.filter(e=>["En curso","Esperando respuesta","Judicializado"].includes(e.col)).map(e=>e.nombre)];
  CERRADOS_TODOS=[...CERRADOS,"Resuelto","Cerrado sin solución"];
  ESTADOS_R=["Nuevo","En análisis","En gestión",...ab,"Derivado a abogados","Resuelto","Cerrado sin solución",...ce]; // también valen para reclamos
}
const COLS = [
  {t:"Sin iniciar", m:s=>colDe(s)==="Sin iniciar"},
  {t:"En curso", m:s=>colDe(s)==="En curso"},
  {t:"Esperando respuesta oficial", m:s=>colDe(s)==="Esperando respuesta"},
  {t:"Judicializado", m:s=>colDe(s)==="Judicializado"},
  {t:"Cerrados", m:s=>colDe(s)==="Cerrados"}
];
const PRIOS = ["Alta","Media","Baja"];
let ESTADOS_R = ["Nuevo","En análisis","En gestión","Derivado a abogados","Resuelto","Cerrado sin solución"];
const ESTADOS_P = ["Nuevo","En análisis","En acompañamiento","Derivado a abogados","Pasado a reclamo","Resuelto"];
const TEMAS = ["Ascenso escalafonario (COPIC)","Adicional por título","Traslado","Sumario / disciplinario","Licencias","Salario / adicionales","Condiciones de trabajo","Vivienda","Otro"];
const temas = ()=>(D&&D.temas&&D.temas.length?D.temas:TEMAS); // se configuran en Administración
const agrupamientos = ()=>(D&&D.agrupamientos)||["Guardaparque Técnico","Guardaparque de Conservación Territorial"];
const AGR_CORTO = {"Guardaparque Técnico":"GT","Guardaparque de Conservación Territorial":"GCT"};
function dlPromos(){const ps=[...new Set((D.reclamos||[]).map(r=>r.promo).filter(Boolean))].sort();return `<datalist id="dlPromo">${ps.map(p=>`<option value="${esc(p)}">`).join("")}</datalist>`}
const TIPOS_DOC = ["Nota de origen","Sub-nota","Agregación","Subsanación","Ampliatoria / Aclaratoria","Informe","Respuesta del organismo","Adjunto"];
const TIPOS_NOV = ["Avance","Llamada","Mail","Reunión","Informe","Resultado","Nota interna"];
const ROLES = ["Comisión Directiva","Abogado/a","Delegado/a"];
const ROL_CORTO = {"Comisión Directiva":"CD","Abogado/a":"ABG","Delegado/a":"DEL","Afiliado/a":"AFI"};
const MAX_MB = 20;

const state = { view:"tablero", f:{inst:"",prio:"",resp:"",q:""}, fr:{estado:"abiertos"}, showTram:false, showRec:false, editExp:false, busy:false, loginPaso:"inicio", loginMail:"", loginMsg:"", sel:new Set(), ftema:"", agrupar:true, grupo:null };
let D = null;          // datos que manda el servidor
let abierto = null;    // id del caso abierto en la ficha

/* ---------- utilidades ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pd = s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmt = s=>s?pd(s).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"}):"—";
const opts=(arr,sel)=>arr.map(v=>`<option value="${esc(v)}"${v===sel?" selected":""}>${esc(v)}</option>`).join("");
const rangoPrio = c=>{const i=PRIOS.indexOf(c.prio);return i<0?PRIOS.length:i}; // sin prioridad va al final
const prioChip = p=>p?`<span class="chip ${esc(p)}">${esc(p)}</span>`:"";
function estadoChip(s){const c=s==="Respuesta negativa"?"neg":["Finalizado","Resuelto"].includes(s)?"okc":"st";return `<span class="chip ${c}">${esc(s||"Sin estado")}</span>`}
function toast(m,err){const e=$("#toast");e.textContent=m;e.style.background=err?"var(--alta)":"";e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,err?6000:3500)}
function rol(){return D?ROL_CORTO[D.usuario.rol]:""}
function esAdmin(){return ["CD","ABG"].includes(rol())}
function esCD(){return rol()==="CD"}
function sesion(v){try{if(v===undefined)return localStorage.getItem("sigunara_sesion")||"";if(v)localStorage.setItem("sigunara_sesion",v);else localStorage.removeItem("sigunara_sesion")}catch(e){return ""}}

function habiles(desde){
  if(!desde)return 0; const fer=new Set(D.feriados||[]); let d=pd(desde), fin=pd(D.hoy), n=0;
  while(d<fin){d.setDate(d.getDate()+1);const w=d.getDay();const iso=d.toISOString().slice(0,10);if(w&&w<6&&!fer.has(iso))n++}
  return n;
}
function ultimo(t){return [t.fecha,t.ultimo,...(t.hist||[]).map(h=>h.fecha)].filter(Boolean).sort().pop()||""}
function stale(t){return ACTIVOS.includes(t.estado)&&habiles(ultimo(t))>=D.diasAlerta}
const flat=ds=>ds.flatMap(d=>[d,...flat(d.hijos||[])]);

/* ---------- comunicación con el servidor ---------- */
/* Dentro de Google usa google.script.run; publicada afuera (GitHub Pages) llama al servidor por internet,
   sin usar ninguna sesión de Google: así no importa cuántas cuentas de Google tenga abiertas el navegador. */
const API_URL = "https://script.google.com/macros/s/AKfycbyZKWeelz5x2ALqpdWQRfa0PG2GS0hwMzzUXaLENtk1eWnXtmkSCCuGks1yBp_9N9DQwQ/exec";
function respuesta(r,ok,fail){
  if(r&&r.ok){if(r.aviso)setTimeout(()=>toast(r.aviso,true),60);return ok(r.data)}
  if(r&&r.auth){sesion(null);D=null;render();}
  const err=new Error(r?r.error:"Error desconocido");err.noAcceso=!!(r&&r.noAcceso);fail(err);
}
function llamar(action,data){
  const req={token:sesion(),action,data};
  if(window.google&&google.script&&google.script.run){
    return new Promise((ok,fail)=>{
      google.script.run.withSuccessHandler(r=>respuesta(r,ok,fail))
        .withFailureHandler(e=>fail(new Error(e&&e.message?e.message:"No se pudo conectar. Revisá tu conexión.")))
        .api(req);
    });
  }
  return new Promise((ok,fail)=>{
    fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(req),credentials:"omit",redirect:"follow"})
      .then(r=>{if(!r.ok)throw new Error("El servidor respondió "+r.status);return r.json()})
      .then(r=>respuesta(r,ok,fail))
      .catch(e=>fail(new Error(e&&e.message&&!/fetch/i.test(e.message)?e.message:"No se pudo conectar. Revisá tu conexión.")));
  });
}
async function accion(action,data,msg){
  if(state.busy)return; state.busy=true; document.body.classList.add("ocupado");
  try{
    const r=await llamar(action,data);
    const datos=r&&r.datos?r.datos:r;
    if(datos&&datos.usuario){D=datos;hidratar();}
    render(); if(abierto)renderFicha();
    if(msg)toast(msg);
    return r;
  }catch(e){toast(e.message,true);throw e}
  finally{state.busy=false;document.body.classList.remove("ocupado")}
}

/* Une documentos y novedades a cada caso. */
function hidratar(){
  aplicarEstados();
  const porCaso={};
  (D.docs||[]).forEach(d=>{d.hijos=[];(porCaso[d.caso]=porCaso[d.caso]||{docs:[],hist:[]}).docs.push(d)});
  (D.novs||[]).forEach(n=>{(porCaso[n.caso]=porCaso[n.caso]||{docs:[],hist:[]}).hist.push(n)});
  const armar=c=>{
    const g=porCaso[c.id]||{docs:[],hist:[]};
    const byId={};g.docs.forEach(d=>byId[d.id]=d);
    c.docs=g.docs.filter(d=>!(d.padre&&byId[d.padre]));
    g.docs.forEach(d=>{if(d.padre&&byId[d.padre])byId[d.padre].hijos.push(d)});
    c.hist=g.hist.sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")||a.id.localeCompare(b.id));
  };
  (D.tramites||[]).forEach(t=>{t.kind="tramite";armar(t)});
  (D.pedidos||[]).forEach(p=>{p.kind="pedido";armar(p)});
  (D.reclamos||[]).forEach(r=>{r.kind="reclamo";armar(r)});
}
function find(id){return (D.tramites||[]).find(t=>t.id===id)||(D.pedidos||[]).find(p=>p.id===id)||(D.reclamos||[]).find(r=>r.id===id)}
function listaResp(txt){return String(txt||"").split(",").map(x=>x.trim()).filter(Boolean)}
function respPicker(id,actual){
  const sel=listaResp(actual), nombres=[...new Set([...(D.responsables||[]),...sel])];
  if(!nombres.length)return `<div class="multi" id="${id}"><span style="color:var(--ink-2);font-size:12.5px">Todavía no hay usuarios cargados. ${esAdmin()?"Cargalos en Administración.":"Pedile a la Comisión Directiva que los cargue."}</span></div>`;
  return `<div class="multi" id="${id}">${nombres.map(n=>`<label class="pick"><input type="checkbox" value="${esc(n)}"${sel.includes(n)?" checked":""}>${esc(n)}</label>`).join("")}</div>`;
}
function dlLugares(){return `<datalist id="dlLugares">${(D.lugares||[]).map(l=>`<option value="${esc(l)}">`).join("")}</datalist>`}

function leerPicker(id){return [...document.querySelectorAll(`#${id} input:checked`)].map(i=>i.value).join(", ")}

async function ingresar(action,data){

             :isP?`<div><small>Correo</small><span style="user-select:all">${esc(t.mail)}</span></div><div><small>Teléfono</small>${esc(t.tel||"—")}</div><div><small>Lugar de trabajo</small>${campoLugar(`data-campo="lugar" value="${esc(t.lugar||"")}" style="width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 7px"`)}</div><div><small>Recibido</small>${fmt(t.fecha)}</div>`
             :`<div><small>Fecha de inicio</small>${fmt(t.fecha)}</div><div><small>Lugar actual</small>${esc(t.lugar||"—")}</div><div><small>Último movimiento</small>${fmt(ultimo(t))} <span style="color:var(--ink-2)">(${habiles(ultimo(t))} días háb.)</span></div>`}
        <div><small>Estado</small><select data-campo="estado">${opts(isR?ESTADOS_R:isP?ESTADOS_P:ESTADOS,t.estado)}</select></div>
        <div><small>Prioridad</small><select data-campo="prio"><option value="">Sin definir</option>${opts(PRIOS,t.prio)}</select></div>
        <div style="grid-column:1/-1"><small>Responsables del seguimiento</small>${state.editResp
          ?`${respPicker("eResp",t.resp)}<div style="display:flex;gap:6px;margin-top:8px"><button class="btn sm primary" data-act="guardarResp">Guardar</button><button class="btn sm" data-act="cancelResp">Cancelar</button></div>`
          :`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${respChips(t.resp)}<button class="btn sm" data-act="editResp">Cambiar</button></div>`}</div>
      </div>
      ${isP?`<div class="summary"><span class="chip ia">Resumen hecho por IA</span><p>${esc(t.resumen)}</p></div>
        <div class="checks" style="margin-top:12px"><label><input type="checkbox" data-chk="respondido" ${t.respondido?"checked":""}> Ya se respondió${t.fResp?` (${fmt(t.fResp)})`:""}</label><label><input type="checkbox" data-chk="acomp" ${t.acomp?"checked":""}> Se dio acompañamiento</label></div>
        <p style="margin:12px 0 0">${t.reclamoId?`<button class="btn sm" data-open="${esc(t.reclamoId)}">Ver el reclamo ${esc(t.reclamoId)} →</button>`:`<button class="btn sm primary" data-torec="${esc(t.id)}">Convertir en reclamo</button>`}</p>`:""}
      ${isR?`<div class="access"><input type="checkbox" id="chkAcceso" data-chk="acceso" ${t.acceso?"checked":""}><div><label for="chkAcceso"><b>Darle acceso al afiliado para seguir este reclamo</b></label><br><span style="color:var(--ink-2);font-size:12.5px">${t.mail?`Al activarlo le llega a ${esc(t.mail)} un mail con su <b>link personal y permanente</b>: entra directo, sin usuario ni contraseña. Solo ve este reclamo y lo marcado como visible, y puede subir sus antecedentes. Si le quitás el acceso, el link deja de funcionar.`:"Primero hay que cargar el correo del afiliado en la planilla."}</span>
        ${t.enlace?`<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn sm" data-copiar="${esc(t.enlace)}">Copiar su link personal</button><span style="font-size:12px;color:var(--ink-2);align-self:center">para mandárselo por WhatsApp si no le llegó el mail</span></div>`:""}</div></div>`:""}
      ${isR?bloqueFusion(t):""}
      ${!isP&&!isR&&stale(t)?`<p style="margin:12px 0 0;color:var(--warn);font-weight:600">⚠ Lleva ${habiles(ultimo(t))} días hábiles sin movimiento.</p>`:""}
    </section>
    <section><header><h2>Documentos (${allDocs.length})</h2>${allDocs.some(d=>d.archivo)?`<button class="btn sm" data-dlall="${esc(t.id)}">Descargar todos (.zip)</button>`:""}</header>
      ${t.docs.length?`<ul class="docs">${docTree(t.docs)}</ul>`:`<p style="color:var(--ink-2);margin:0">Todavía no hay documentos cargados.</p>`}
      <form class="inline" id="fDoc">
        <div class="row">
          <label class="field">Número GDE${isR||isP?" (si tiene)":""}<input id="dGde" placeholder="IF-2026-00000000-APN-DGA#APNAC"></label>
          <label class="field">Tipo<select id="dTipo">${opts(TIPOS_DOC,t.docs.length?"Sub-nota":"Nota de origen")}</select></label>
        </div>
        <label class="field">Descripción (obligatoria): ¿qué es este documento?<input id="dDesc" required placeholder="Ej.: Pronto despacho por falta de respuesta"></label>
        <div class="row">
          ${allDocs.length?`<label class="field">Depende de<select id="dPadre"><option value="">— Ninguno (documento principal) —</option>${allDocs.map(d=>`<option value="${esc(d.id)}">${esc(d.gde||d.id)} · ${esc(d.desc.slice(0,40))}</option>`).join("")}</select></label>`:""}
          <label class="field">Archivo (PDF, imagen, Word; hasta ${MAX_MB} MB)<input id="dFile" type="file"></label>
        </div>
        ${isR?`<div class="checks"><label><input type="checkbox" id="dVis"> Visible para el afiliado</label></div>`:""}
        ${!isP&&!t.exp?`<div class="checks"><label><input type="checkbox" id="dGenExp"> Con esta nota se abrió un expediente de seguimiento</label></div><label class="field" id="dExpWrap" hidden>Número de expediente<input id="dExp" placeholder="EX-2026-00000000- -APN-DGA#APNAC"></label>`:""}
        <div><button class="btn primary" type="submit">Agregar documento</button></div>
      </form>
    </section>
    <section><header><h2>Historial de novedades</h2></header>
      ${t.hist.length?`<ul class="timeline">${[...t.hist].reverse().map(h=>`<li class="${h.afil?"afil":""}"><div class="when"><b>${fmt(h.fecha)}</b> · ${esc(h.tipo)} · ${esc(h.autor)} ${isR?(h.vis?'<span class="chip vis">Visible para el afiliado</span>':'<span class="chip int">Interna</span>'):""}</div><p>${esc(h.texto)}</p></li>`).join("")}</ul>`:`<p style="color:var(--ink-2);margin:0">Sin novedades todavía.</p>`}
      <form class="inline" id="fNov">
        <div class="row"><label class="field">Tipo de novedad<select id="nTipo">${opts(TIPOS_NOV,"Avance")}</select></label></div>
        ${isR?`<div class="checks"><label><input type="checkbox" id="nVis" ${t.acceso?"checked":""}> Visible para el afiliado${t.acceso?" (le llega un aviso por mail)":""}</label></div>`:""}
        <label class="field">¿Qué pasó?<textarea id="nTxt" required placeholder="Ej.: Se habló con RRHH, quedaron en responder la semana próxima."></textarea></label>
        <div><button class="btn primary" type="submit">Agregar novedad</button></div>
      </form>
    </section>
  </aside>`;
}

/* ---------- selección de varios casos (pedidos o reclamos) ---------- */
function chk(id){return `<label class="selbox" title="Seleccionar"><input type="checkbox" data-sel="${esc(id)}"${state.sel.has(id)?" checked":""} aria-label="Seleccionar ${esc(id)}"></label>`}
/* ---------- fusionar casos del mismo afiliado ---------- */
const normTxt=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
/* Mismo afiliado: mismo correo, o mismo nombre si alguno no tiene correo. */
const mismoAfiliado=(a,b)=>(a.mail&&b.mail)?normTxt(a.mail)===normTxt(b.mail):!!a.nombre&&normTxt(a.nombre)===normTxt(b.nombre);
function otrosDelAfiliado(r){
  return [...D.reclamos.filter(x=>x.id!==r.id),...D.pedidos.filter(p=>!p.reclamoId)].filter(x=>mismoAfiliado(r,x));
}
function bloqueFusion(t){
  const iguales=otrosDelAfiliado(t);
  if(!state.fusion)return `<div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${iguales.length?`<span class="chip stale">${iguales.length} caso(s) más de ${esc(t.nombre)}</span>`:""}<button class="btn sm" data-act="abrirFusion">Fusionar con otro caso del afiliado…</button></div>`;
  const resto=[...D.reclamos.filter(x=>x.id!==t.id&&!iguales.includes(x)),...D.pedidos.filter(p=>!p.reclamoId&&!iguales.includes(p))];
  const fila=(x,marcar)=>{const isP=x.kind==="pedido";return `<label class="pick" style="display:flex;gap:8px;align-items:flex-start;width:100%;justify-content:flex-start;text-align:left"><input type="checkbox" value="${esc(x.id)}"${marcar?" checked":""}><span><b>${esc(x.id)}</b> · ${esc(isP?x.asunto:x.titulo)}<br><small style="color:var(--ink-2)">${esc(x.nombre)} · ${isP?"pedido por mail recibido":"reclamo iniciado"} el ${fmt(x.fecha)}${isP?"":" · "+esc(x.estado)}</small></span></label>`};
  return `<div class="box" style="margin-top:12px;border:2px solid var(--lima-2)"><h2 style="font-size:14px">Fusionar en este reclamo (${esc(t.id)})</h2>
    <p style="font-size:13px;color:var(--ink-2);margin:4px 0 10px">Las novedades y documentos de los casos que marques pasan a este reclamo, ordenados por fecha. Los reclamos absorbidos quedan guardados como «Fusionado» y su link lleva a este.</p>
    <div id="fusLista" style="display:grid;gap:6px">${iguales.length?`<small style="font-weight:700">Del mismo afiliado</small>${iguales.map(x=>fila(x,true)).join("")}`:`<small>No encontré otros casos con el mismo correo o nombre.</small>`}
      ${resto.length?`<details><summary style="cursor:pointer;font-size:13px">Elegir otro caso (otro correo o nombre escrito distinto)</summary><div style="display:grid;gap:6px;margin-top:6px">${resto.map(x=>fila(x,false)).join("")}</div></details>`:""}</div>
    <div style="display:flex;gap:6px;margin-top:10px"><button class="btn sm primary" data-act="fusionar">Fusionar</button><button class="btn sm" data-act="cancelarFusion">Cancelar</button></div></div>`;
}
async function fusionar(principal,otros){
  const p=find(principal),os=otros.map(find).filter(Boolean);
  if(!os.length){toast("Marcá al menos un caso para fusionar.",true);return}
  const distintos=os.filter(x=>!mismoAfiliado(p,x));
  if(!confirm(`¿Fusionar en ${p.id} («${p.titulo}»)?\n\n${os.map(x=>"• "+x.id+" · "+x.nombre+" · "+(x.titulo||x.asunto)).join("\n")}`+
    (distintos.length?`\n\nATENCIÓN: ${distintos.map(x=>x.id).join(", ")} tiene(n) otro correo o nombre. Fusioná solo si es la misma persona.`:"")+"\n\nNo se puede deshacer desde la plataforma."))return;
  state.fusion=false;state.sel.clear();
  await accion("fusionarReclamos",{principal,otros},"Casos fusionados en "+principal+".");
  openFicha(principal);
}

function barraSeleccion(esRec){
  const n=state.sel.size; if(!n)return "";
  const soloRec=[...state.sel].every(id=>D.reclamos.some(r=>r.id===id));
  return `<div class="aviso-guardar"><span>${n} seleccionado(s)</span><span style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn sm primary" data-act="responderGrupo">Responder a los ${n}</button>
    ${esRec&&soloRec?`<button class="btn sm" data-act="exportCsv">Descargar planilla</button><button class="btn sm" data-act="exportZip">Descargar documentos (ZIP)</button>`:""}
    ${n>=2&&[...state.sel].some(id=>D.reclamos.some(r=>r.id===id))?`<button class="btn sm" data-act="fusionarSel" title="Junta los casos seleccionados en el reclamo más antiguo">Fusionar los ${n}</button>`:""}
    <button class="btn sm" data-act="limpiarSel">Quitar selección</button></span></div>`;
}
/* Encabezado de grupo con casilla para seleccionar a todos los del grupo. */
function cabGrupo(tag,titulo,ids,extra=""){
  const todos=ids.length&&ids.every(id=>state.sel.has(id));
  return `<${tag} class="grupo-cab"><label class="selbox"><input type="checkbox" data-selgrupo="${esc(ids.join(","))}"${todos?" checked":""} aria-label="Seleccionar todos: ${esc(titulo)}"></label><span>${esc(titulo)}</span><span class="count">${ids.length}</span>${extra}</${tag}>`;
}
function porClave(lista,fn){const m=new Map();lista.forEach(x=>{const k=fn(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x)});return m}
const ordenTemas=k=>{const i=temas().indexOf(k);return i<0?99:i};

/* ---------- pedidos ---------- */
function tarjetaPedido(p){
  return `<article class="req ${p.respondido||p.reclamoId?"":"nuevo"}">
    <div class="who">${p.reclamoId?"":chk(p.id)}<strong style="flex:1">${esc(p.nombre)}</strong><span class="meta" style="display:flex;gap:6px;flex-wrap:wrap">${p.respondido||p.reclamoId?"":'<span class="chip neg">Sin responder</span>'}${prioChip(p.prio)}${estadoChip(p.estado)}</span></div>
    <div class="contact"><span>${esc(p.mail)}</span>${p.tel?`<span>${esc(p.tel)}</span>`:""}${p.lugar?`<em style="font-style:normal">${esc(p.lugar)}</em>`:""}<em style="font-style:normal">Recibido ${fmt(p.fecha)}</em></div>
    <div class="gde">Asunto: ${esc(p.asunto)}</div>
    <div class="summary" style="margin:0"><span class="chip ia">Resumen hecho por IA</span>${p.agrup?` <span class="chip st">${esc(p.agrup)}</span>`:""}<p>${esc(p.resumen)}</p></div>
    <div class="checks"><label><input type="checkbox" data-pchk="respondido" data-id="${esc(p.id)}" ${p.respondido?"checked":""}> Ya se respondió</label><label><input type="checkbox" data-pchk="acomp" data-id="${esc(p.id)}" ${p.acomp?"checked":""}> Se dio acompañamiento</label></div>
    <div class="row" style="align-items:center"><span style="color:var(--ink-2);font-size:12.5px">Responsable: <b style="color:var(--ink)">${esc(p.resp||"Sin asignar")}</b></span><span style="display:flex;gap:6px;flex:0 0 auto;flex-wrap:wrap">${p.reclamoId?`<button class="btn sm" data-open="${esc(p.reclamoId)}">Ver reclamo</button>`:`<button class="btn sm primary" data-torec="${esc(p.id)}">Convertir en reclamo</button>`}<button class="btn sm" data-open="${esc(p.id)}">Abrir ficha</button>${esAdmin()&&!p.reclamoId?`<button class="btn sm" data-borrarped="${esc(p.id)}" title="Para mails que entraron por una palabra clave pero no son pedidos de apoyo" style="color:var(--alta)">Borrar</button>`:""}</span></div>
  </article>`;
}
function vPedidos(){
  const ps=[...D.pedidos].filter(p=>!state.ftema||(p.tema||"Sin tema")===state.ftema)
    .sort((a,b)=>(a.respondido-b.respondido)||(b.fecha||"").localeCompare(a.fecha||""));
  const pendientes=ps.filter(p=>!p.reclamoId), pasados=ps.filter(p=>p.reclamoId);
  const grupos=[...porClave(pendientes,p=>p.tema||"Sin tema")].sort((a,b)=>ordenTemas(a[0])-ordenTemas(b[0]));
  const temasUsados=[...new Set(D.pedidos.map(p=>p.tema||"Sin tema"))];
  $("#main").innerHTML=`<div class="head"><div><h1>Pedidos por mail</h1><p class="lede">Se cargan solos desde sigunara@gmail.com y la IA sugiere el tema. Marcá varios del mismo tema y tocá «Responder»: a cada uno le llega su propio mail con el modelo de nota y el link a su reclamo.</p></div></div>
  ${barraSeleccion(false)}
  <div class="filters"><select id="fPedTema" aria-label="Tema"><option value="">Todos los temas</option>${opts(temasUsados,state.ftema)}</select></div>
  ${grupos.map(([t,lista])=>`<section class="group">${cabGrupo("h2",t,lista.map(p=>p.id))}<div class="list">${lista.map(tarjetaPedido).join("")}</div></section>`).join("")}
  ${pasados.length?`<details class="group"><summary>Ya pasados a reclamo (${pasados.length})</summary><div class="list" style="margin-top:10px">${pasados.map(tarjetaPedido).join("")}</div></details>`:""}
  ${ps.length?"":'<p class="lede">Todavía no llegó ningún pedido. Cuando llegue un mail con esas palabras en el asunto, aparece acá.</p>'}`;
}

/* ---------- reclamos ---------- */
function tarjetaReclamo(r){
  const u=r.hist.at(-1);
  return `<article class="req ${u&&u.afil?"nuevo":""}">
    <div class="who">${chk(r.id)}<strong style="flex:1">${esc(r.titulo)}</strong><span class="meta" style="display:flex;gap:6px;flex-wrap:wrap">${prioChip(r.prio)}${estadoChip(r.estado)}</span></div>
    <div class="contact"><b style="color:var(--ink)">${esc(r.nombre)}</b>${r.lugar?`<em style="font-style:normal">${esc(r.lugar)}</em>`:""}<em style="font-style:normal">Iniciado ${fmt(r.fecha)}</em></div>
    <div class="meta" style="display:flex;gap:6px;flex-wrap:wrap;font-size:12px"><span class="chip st">${esc(r.tema)}</span>${r.agrup?`<span class="chip inst">${esc(AGR_CORTO[r.agrup]||r.agrup)}</span>`:""}${r.promo?`<span class="chip inst">Promoción ${esc(r.promo)}</span>`:""}<span class="chip st">Origen: ${esc(r.origen)}</span>${r.acceso?'<span class="chip vis">El afiliado sigue su reclamo</span>':""}${(n=>n?`<span class="chip stale" title="Abrí la ficha y usá «Fusionar» si es el mismo tema">${n} caso(s) más del mismo afiliado</span>`:"")(otrosDelAfiliado(r).length)}</div>
    ${u?`<div style="font-size:13px;${u.afil?"background:var(--accent-soft);padding:8px 10px":""}"><span style="color:var(--ink-2);font-size:12px">${u.afil?"<b style='color:var(--verde)'>NOVEDAD DEL AFILIADO</b> · ":"Última novedad · "}${fmt(u.fecha)}</span><br>${esc(u.texto)}</div>`:""}
    <div class="row" style="align-items:center"><span style="color:var(--ink-2);font-size:12.5px">Responsable: <b style="color:var(--ink)">${esc(r.resp||"Sin asignar")}</b></span><button class="btn sm" data-open="${esc(r.id)}" style="flex:0 0 auto">Abrir ficha</button></div>
  </article>`;
}
function vReclamos(){
  const f=state.fr,abiertos=r=>!CERRADOS_TODOS.includes(r.estado);
  const rs=D.reclamos.filter(r=>(f.estado==="todos"||(f.estado==="abiertos"?abiertos(r):!abiertos(r)))&&(!state.ftemaR||r.tema===state.ftemaR))
    .sort((a,b)=>((b.hist.at(-1)||{}).afil?1:0)-((a.hist.at(-1)||{}).afil?1:0)||rangoPrio(a)-rangoPrio(b));
  let cuerpo;
  if(state.agrupar){
    const porTema=[...porClave(rs,r=>r.tema||"Otro")].sort((a,b)=>ordenTemas(a[0])-ordenTemas(b[0]));
    cuerpo=porTema.map(([t,lt])=>{
      const conSub=lt.some(r=>r.agrup||r.promo);
      const sub=!conSub?`<div class="list">${lt.map(tarjetaReclamo).join("")}</div>`
        :[...porClave(lt,r=>r.agrup||"Agrupamiento sin definir")].sort((a,b)=>a[0].localeCompare(b[0])).map(([ag,la])=>
          `<div class="subgrupo">${cabGrupo("h3",ag,la.map(r=>r.id))}${[...porClave(la,r=>r.promo?"Promoción "+r.promo:"Promoción sin definir")].sort((a,b)=>a[0].localeCompare(b[0],"es",{numeric:true})).map(([pr,lp])=>
            `<div class="subgrupo">${cabGrupo("h4",pr,lp.map(r=>r.id))}<div class="list">${lp.map(tarjetaReclamo).join("")}</div></div>`).join("")}</div>`).join("");
      return `<section class="group">${cabGrupo("h2",t,lt.map(r=>r.id))}${sub}</section>`;
    }).join("");
  }else cuerpo=`<div class="list">${rs.map(tarjetaReclamo).join("")}</div>`;
  $("#main").innerHTML=`<div class="head"><div><h1>Reclamos de afiliados</h1><p class="lede">Agrupados por tema, y dentro de cada tema por agrupamiento y promoción. Marcá un grupo entero (o algunos) para responderles a todos juntos o descargar la planilla y los documentos para un reclamo colectivo.</p></div>
    <button class="btn primary" data-act="toggleRec">+ Nuevo reclamo</button></div>
  <form class="box" id="fRec" style="margin-bottom:18px" ${state.showRec?"":"hidden"}><h2>Nuevo reclamo</h2>
    <div class="row" style="margin-top:10px">
      <label class="field" style="flex:2 1 260px">Afiliado/a<input id="rNom" required placeholder="Nombre y apellido"></label>
      <label class="field">Correo<input id="rMail" type="email" placeholder="para avisos y acceso"></label>
      <label class="field">Teléfono<input id="rTel"></label>
      <label class="field" style="flex:2 1 260px">Lugar de trabajo${campoLugar('id="rLugar"')}</label>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="field" style="flex:3 1 260px">¿Cuál es el reclamo?<input id="rTit" required placeholder="Ej.: No le pagan el suplemento por título"></label>
      <label class="field">Tema<select id="rTema">${opts(temas())}</select></label>
      <label class="field">Prioridad<select id="rPrio"><option value="">Sin definir</option>${opts(PRIOS)}</select></label>
    </div>
    <div class="field" style="margin-top:8px">Responsables del seguimiento (podés marcar varios)${respPicker("rResp","")}</div>
    <label class="field" style="margin-top:8px">Detalle<textarea id="rDet" placeholder="Qué pasó, desde cuándo, qué pide el afiliado"></textarea></label>
    <div style="margin-top:8px"><button class="btn primary" type="submit">Crear reclamo</button></div></form>
  ${barraSeleccion(true)}
  <div class="filters"><select id="fRecEst" aria-label="Estado">${[["abiertos","Abiertos"],["cerrados","Resueltos o cerrados"],["todos","Todos"]].map(([v,t])=>`<option value="${v}"${f.estado===v?" selected":""}>${t}</option>`).join("")}</select>
    <select id="fRecTema" aria-label="Tema"><option value="">Todos los temas</option>${opts([...new Set(D.reclamos.map(r=>r.tema).filter(Boolean))],state.ftemaR)}</select>
    <label style="display:flex;gap:6px;align-items:center;font-size:13px"><input type="checkbox" id="fAgrupar"${state.agrupar?" checked":""}> Agrupar por tema</label></div>
  ${rs.length?cuerpo:"<p class='lede'>No hay reclamos en esta vista.</p>"}`;
}

/* ---------- responder a varios ---------- */
function abrirGrupo(){
  const ids=[...state.sel], casos=ids.map(find).filter(Boolean);
  const tems=[...new Set(casos.map(c=>c.tema).filter(Boolean))];

/* ---------- prioridad de los abogados ---------- */
/* La Comisión Directiva ordena los casos abiertos que tienen algún abogado/a como responsable; los abogados ven su lista en ese orden. */
let CERRADOS_TODOS=[...CERRADOS,"Resuelto","Cerrado sin solución"];
function casosAbogados(){
  const abg=D.abogados||[], orden=state.orden||D.ordenAbogados||[];
  const pos=id=>{const i=orden.indexOf(id);return i<0?1e6:i};
  return [...D.tramites,...D.reclamos].filter(c=>!CERRADOS_TODOS.includes(c.estado)&&listaResp(c.resp).some(n=>abg.includes(n)))
    .sort((a,b)=>pos(a.id)-pos(b.id)||rangoPrio(a)-rangoPrio(b)||(a.fecha||"").localeCompare(b.fecha||""));
}
function fechaPresentacion(c){
  if(c.estado!==ESPERA)return "";
  const h=[...(c.hist||[])].reverse().find(h=>h.tipo==="Cambio"&&/^Estado:/.test(h.texto||"")&&(h.texto||"").endsWith("→ "+ESPERA));
  return h?h.fecha:(c.ultimo||c.fecha||"");
}
const diasDesde=iso=>iso?Math.max(0,Math.round((pd(D.hoy)-pd(iso))/864e5)):0;
function chipPresentado(c){
  const f=fechaPresentacion(c); if(!f)return "";
  const d=diasDesde(f);
  return `<span class="chip espera" title="Presentado el ${fmt(f)}">Con presentación a la espera de respuesta · ${d===0?"hoy":d===1?"hace 1 día":`hace ${d} días`}</span>`;
}

/* Mueve un caso dentro de la lista. */
function moverOrden(id,como){
  const vis=casosAbogados().map(c=>c.id), todos=vis;
  const i=vis.indexOf(id); if(i<0)return;
  const destino=como==="primero"?vis[0]:como==="subir"?vis[i-1]:vis[i+1]; if(!destino||destino===id)return;
  const sin=todos.filter(x=>x!==id), j=sin.indexOf(destino);
  sin.splice(como==="bajar"?j+1:j,0,id);
  state.orden=sin; render();
}

/* ---------- archivos ---------- */
function leerArchivo(file){
  return new Promise((ok,fail)=>{
    if(!file)return ok(null);
    if(file.size>MAX_MB*1024*1024)return fail(new Error(`El archivo pesa más de ${MAX_MB} MB.`));
    const r=new FileReader();
    r.onload=()=>ok({base64:String(r.result).split(",")[1],mimeType:file.type||"application/octet-stream",nombreArchivo:file.name});
    r.onerror=()=>fail(new Error("No se pudo leer el archivo."));
    r.readAsDataURL(file);
  });
}
async function bajar(action,data){
  try{
    state.busy=true;document.body.classList.add("ocupado");toast("Preparando la descarga…");
    const r=await llamar(action,data);
    const bytes=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0));
    const url=URL.createObjectURL(new Blob([bytes],{type:r.mimeType}));
    const a=document.createElement("a");a.href=url;a.download=r.nombre;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
    toast("Descarga lista: "+r.nombre);

/* ---------- arranque ---------- */
/* Link personal del afiliado: ?acceso=… entra directo a su reclamo, sin usuario ni contraseña. */
function enlaceEnUrl(){
  return new Promise(ok=>{
    if(window.google&&google.script&&google.script.url)google.script.url.getLocation(l=>ok((l.parameter||{}).acceso||""));
    else ok(new URLSearchParams(location.search).get("acceso")||"");
  });
}
(async function(){
  const enlace=await enlaceEnUrl();
  if(enlace){
    $("#main").innerHTML='<p class="lede" style="padding:30px 0">Entrando a tu reclamo…</p>';
    try{history.replaceState(null,"",location.pathname)}catch(e){}
    try{const r=await llamar("entrarConEnlace",{enlace});sesion(r.token);D=r.datos;hidratar();state.view=rol()==="AFI"?"afiliado":"tablero";render();return}
    catch(e){sesion(null);render();toast(e.message,true);return}
  }
  if(!sesion()){render();return}
  $("#main").innerHTML='<p class="lede" style="padding:30px 0">Cargando…</p>';
  try{D=await llamar("cargar",{});hidratar();state.view=rol()==="AFI"?"afiliado":"tablero"}catch(e){D=null}
  render();
})();
